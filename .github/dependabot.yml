# Met à jour les actions des workflows propres à lmelp-mobile (issue #159) :
# job `android` de ci.yml, release.yml, app-preview.yml, build-export-image.yml.
# Les actions qui ne servent qu'aux parties venant du template PyFoundry sont
# ignorées : le template les met à jour, et une PR Dependabot créerait des rejets
# au prochain `cruft update`. Les actions partagées (checkout, upload-artifact)
# restent suivies : la version poussée par Dependabot rejoint celle du template.
# Après une PR Dependabot, mettre à jour NODE24_MIN_MAJOR si une nouvelle action
# apparaît (tests/test_github_workflows.py).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: astral-sh/setup-uv
      - dependency-name: actions/configure-pages
      - dependency-name: actions/upload-pages-artifact
      - dependency-name: actions/deploy-pages
    commit-message:
      prefix: chore
      include: scope
