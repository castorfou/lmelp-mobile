name: 🔄 Continuous Integration

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  tests:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: 🐍 Install uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: 📦 Install dependencies
      run: uv sync --extra dev

    - name: 🔍 Lint with ruff
      run: uv run ruff check . --output-format=github

    - name: 🧪 Run tests
      run: uv run pytest tests/ -v

    - name: 🔧 Type check with mypy
      run: uv run mypy

  pre-commit:
    name: 🪝 Pre-commit hooks
    runs-on: ubuntu-latest
    env:
      # Venv hors du dépôt, comme dans le devcontainer (hook no-venv-at-root)
      UV_PROJECT_ENVIRONMENT: /tmp/venv
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: 🐍 Install uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: 🐍 Set up Python
      run: uv python install 3.11

    - name: 🔒 Check uv.lock is up to date
      run: uv lock --check

    - name: 📦 Install dependencies
      run: uv sync --extra dev

    - name: 🪝 Run pre-commit hooks
      run: uv run pre-commit run --all-files --show-diff-on-failure

  build:
    name: 🏗️ Build package
    runs-on: ubuntu-latest
    needs: [tests, pre-commit]
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: 🐍 Install uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: 🐍 Set up Python
      run: uv python install 3.11

    - name: 📦 Install build dependencies
      run: uv sync

    - name: 🏗️ Build package
      run: uv build

    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  android:
    name: 🤖 Android Tests & Build
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        # Le défaut 'tools platform-tools' échoue : le paquet 'tools' n'existe plus
        # avec cmdline-tools 16.0 (image runner). Gradle installe platform/build-tools.
        packages: 'platform-tools'

    - name: 🔑 Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: 🧪 Run unit tests
      run: ./gradlew :app:testDebugUnitTest

    - name: 📤 Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-test-results
        path: app/build/reports/tests/

    - name: 🏗️ Build debug APK
      run: ./gradlew assembleDebug
